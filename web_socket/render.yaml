services:
  - type: web
    name: exp73-chat-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CLIENT_URL
        value: https://exp7-3-chat-box.vercel.app,https://exp73-chat-client.onrender.com,http://localhost:5173,http://localhost:3000

  - type: web
    name: exp73-chat-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SOCKET_SERVER_URL
        value: https://exp73-chat-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
