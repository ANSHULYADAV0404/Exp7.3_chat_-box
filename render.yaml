services:
  - type: web
    name: exp73-chat-server
    runtime: node
    plan: free
    rootDir: web_socket/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: CLIENT_URL
        value: https://exp73-chat-client.onrender.com

  - type: web
    name: exp73-chat-client
    runtime: static
    plan: free
    rootDir: web_socket/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SOCKET_SERVER_URL
        value: https://exp73-chat-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
